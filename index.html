<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Симулятор Короля</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#170e1c;--velvet:#2b1531;--velvet2:#3a1d42;--gold:#d9b26a;--parch:#efe3c8;--blood:#c23a44;--leaf:#5fae7a;--muted:#a898ad}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--velvet2),var(--ink) 70%);color:var(--parch);font-family:'Philosopher',Georgia,serif;display:flex;justify-content:center;overflow:hidden}
.screen{display:none;width:100%;max-width:420px;height:100%;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));flex-direction:column}
.screen.on{display:flex}
button{font-family:inherit;cursor:pointer;border:0}
.btn{width:100%;padding:15px;border-radius:10px;font-size:1.1rem;font-weight:700;background:var(--velvet2);color:var(--parch);border:1px solid rgba(217,178,106,.35);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#e6c47f,#c79a4b);color:#2a1a08;border-color:#f0d9a0}
.stack{display:flex;flex-direction:column;gap:12px}

/* меню */
#menu{justify-content:center;text-align:center;gap:34px}
.crown{font-size:5.5rem;filter:drop-shadow(0 0 28px rgba(217,178,106,.55));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:2.5rem;line-height:1.05;color:var(--gold);letter-spacing:.5px}
.sub{color:var(--muted);margin-top:10px;font-size:1.05rem}
.best{color:var(--gold);font-size:1rem;min-height:1.2em}

/* игра */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(217,178,106,.25);border-radius:12px;padding:9px 8px 10px;text-align:center;position:relative}
.stat .ic{font-size:1.5rem}
.stat .nm{font-size:.8rem;color:var(--muted)}
.track{height:7px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.fill{height:100%;width:50%;background:var(--gold);border-radius:4px;transition:width .5s ease,background .3s}
.fill.low{background:var(--blood)}
.stat.up{animation:up .6s}.stat.down{animation:down .6s}
@keyframes up{40%{transform:scale(1.07);border-color:var(--leaf)}}
@keyframes down{40%{transform:scale(1.07);border-color:var(--blood)}}
.pop{position:absolute;top:-10px;right:8px;font-weight:700;font-size:1.15rem;pointer-events:none;animation:fl .9s ease-out forwards}
.pop.p{color:var(--leaf)}.pop.m{color:var(--blood)}
@keyframes fl{to{opacity:0;transform:translateY(-26px)}}
.yearbar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;color:var(--gold)}
.icon-btn{background:rgba(0,0,0,.3);color:var(--parch);width:40px;height:40px;border-radius:50%;font-size:1.1rem;border:1px solid rgba(217,178,106,.3)}
.card{flex:1;min-height:0;border-radius:18px;padding:22px 20px 20px;text-align:center;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--velvet2),var(--velvet));border:1px solid var(--gold);box-shadow:inset 0 0 0 5px var(--velvet),inset 0 0 0 6px rgba(217,178,106,.4),0 14px 36px rgba(0,0,0,.55)}
.card.in{animation:deal .35s ease-out}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotate(-1.5deg)}}
.avatar{font-size:4.4rem;margin:auto 0 6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.ev-t{font-size:1.45rem;color:var(--gold);margin-bottom:8px}
.ev-d{font-size:1.08rem;line-height:1.4;color:var(--parch);opacity:.9;margin-bottom:auto;padding-bottom:14px}

/* конец и таблица */
#over{justify-content:center;text-align:center;gap:16px}
#over h2{color:var(--blood);font-size:2rem}
.big{font-size:3.2rem;color:var(--gold);line-height:1}
.rank{color:var(--parch);font-size:1.2rem}
.vol{display:flex;align-items:center;gap:10px;padding:4px 6px}
.vol input{flex:1;accent-color:var(--gold);height:28px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:640px){.avatar{font-size:3.2rem}.ev-d{font-size:1rem}}
.btn small{display:block;font-size:.85rem;font-weight:400;opacity:.75;margin-top:3px}
.card{position:relative;touch-action:none}
#sw{position:absolute;top:12px;left:16px;right:16px;font-size:1.15rem;font-weight:700;color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 2px 6px #000}
.stat.hl{border-color:var(--gold);transform:scale(1.05)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--gold);color:#2a1a08;padding:10px 16px;border-radius:12px;font-weight:700;max-width:90%;text-align:center;transition:transform .35s;z-index:9}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="toast"></div>
<section class="screen on" id="menu">
  <div>
    <div class="crown">👑</div>
    <h1>Симулятор<br>Короля</h1>
    <p class="sub">Удержи Могущество, Преданность и Казну. Если любой показатель упадёт до нуля или дойдёт до максимума, правлению конец</p>
  </div>
  <div class="best" id="best"></div>
  <div class="stack">
    <button class="btn gold" onclick="startGame()">Начать правление</button>
    <button class="btn" id="snd-btn" onclick="toggleSound()">Звук: вкл</button>
    <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="100" step="1" aria-label="Громкость"><span>🔊</span></div>
  </div>
</section>

<section class="screen" id="game">
  <div class="stats">
    <div class="stat" id="s-army"><div class="ic">🛡️</div><div class="nm">Могущество</div><div class="track"><div class="fill" id="f-army"></div></div></div>
    <div class="stat" id="s-people"><div class="ic">👥</div><div class="nm">Преданность</div><div class="track"><div class="fill" id="f-people"></div></div></div>
    <div class="stat" id="s-treasury"><div class="ic">💰</div><div class="nm">Казна</div><div class="track"><div class="fill" id="f-treasury"></div></div></div>
  </div>
  <div class="yearbar">
    <span id="year">Год 1</span>
    <button class="icon-btn" onclick="toMenu()" aria-label="В меню">☰</button>
  </div>
  <div class="card" id="card">
    <div id="sw"></div>
    <div class="avatar" id="av"></div>
    <div class="ev-t" id="et"></div>
    <div class="ev-d" id="ed"></div>
    <div class="stack">
      <button class="btn gold" id="b1" onclick="choose(0)"></button>
      <button class="btn" id="b2" onclick="choose(1)"></button>
    </div>
  </div>
</section>

<section class="screen" id="over">
  <div style="font-size:4.5rem" id="o-ic">💀</div>
  <h2 id="o-t">Королевство пало</h2>
  <p id="o-r" style="color:var(--muted);font-size:1.1rem"></p>
  <div><div class="big" id="o-y">0</div><div class="rank" id="o-rank"></div></div>
  <div class="best" id="o-new"></div>
  <div class="best" id="o-dyn"></div>
  <div class="stack">
    <button class="btn gold" onclick="startGame()">Править заново</button>
    <button class="btn" onclick="toMenu()">В меню</button>
  </div>
</section>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }
const $ = id => document.getElementById(id);
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {id: 0, first_name: "Игрок"};
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// [иконка, заголовок, описание, [текст, здоровье, любовь, казна] x2]
const EVENTS = [
["🐉","Дракон в горах","В пещерах поселился дракон и ворует скот крестьян.",["Послать рыцарей",-15,20,-10],["Откупиться золотом",0,-10,-25,"dragon"]],
["🌾","Голодный год","Урожай сгорел от засухи. Народ просит раздать зерно из королевских амбаров.",["Раздать зерно",0,25,-25],["Сберечь запасы",0,-20,10,"grain"]],
["⚔️","Набег разбойников","На границы напала крупная банда. Отправить гвардию или выплатить дань?",["Отправить гвардию",-10,15,-10],["Заплатить откуп",0,-15,-20]],
["🏥","Эпидемия лихорадки","В бедных районах столицы вспыхнула неизвестная болезнь.",["Карантин и лекари",0,10,-15],["Ничего не делать",-15,-20,0,"plague"]],
["👸","Дипломатический брак","Соседний король предлагает союз и руку своей дочери.",["Сыграть свадьбу",20,10,-15,"heir"],["Вежливо отказать",-10,-5,0]],
["📜","Налоговая реформа","Министр предлагает поднять налоги для крестьян.",["Поднять налоги",0,-25,35],["Снизить налоги",0,20,-20]],
["🏴‍☠️","Пираты","Пираты топят ваши торговые корабли в южном море.",["Построить флот",20,5,-30],["Закрыть порты",-10,-15,5]],
["⛪","Верховный жрец","Церковь требует построить собор в честь спасения королевства.",["Дать денег на храм",0,20,-25],["Отказать жрецу",0,-20,5,"church"]],
["🕵️","Шпионский заговор","Разведка докладывает: один из герцогов готовит переворот.",["Арестовать герцога",10,-15,15],["Установить слежку",-10,0,-10,"duke"]],
["⛏️","Золотая жила","Шахтеры нашли золото, но рудник аварийный.",["Добывать любой ценой",0,-20,40,"gold"],["Добывать осторожно",0,5,15]],
["🎪","Бродячий цирк","В столицу приехали артисты! Устроить праздник для всех?",["Устроить праздник",0,25,-20],["Запретить шум",0,-15,0]],
["🏰","Заморский купец","Гильдмейстер предлагает вложить деньги в шелковый путь.",["Продать торговые права",0,-10,30],["Не рисковать",0,0,0]],
["🧱","Крепостные стены","Главная цитадель обветшала и требует срочного ремонта.",["Отремонтировать",20,0,-25],["Отложить ремонт",-20,0,0]],
["🎨","Придворный живописец","Знаменитый художник предлагает написать ваш портрет.",["Заказать портрет",0,10,-15],["Выгнать художника",0,-5,0]],
["⚖️","Суд над крестьянином","Бедняк украл буханку хлеба, чтобы прокормить детей.",["Помиловать",-5,20,0],["Наказать по закону",5,-15,5]],
["🎓","Королевский университет","Ученые просят открыть академию наук и искусств.",["Основать академию",10,15,-30],["Отказать",0,-10,5]],
["🌊","Наводнение","Река вышла из берегов и затопила прибрежные деревни.",["Выделить помощь",0,25,-25],["Пусть справляются сами",0,-25,0]],
["🐺","Стая лютоволков","Огромные волки нападают на путников в королевском лесу.",["Устроить охоту",10,10,-10],["Закрыть лес",0,-15,0]],
["🏇","Королевский турнир","Дворяне хотят устроить рыцарский турнир в честь вашего дня рождения.",["Провести турнир",20,15,-25],["Скромно отпраздновать",0,-10,0]],
["🛡️","Набор рекрутов","Генерал просит объявить набор новых солдат.",["Объявить набор",25,-15,-10],["Отказать",-10,5,0]],
["🗡️","Бунт наёмников","Наёмники требуют жалованье и грозят уйти к врагу.",["Заплатить",10,0,-20],["Распустить отряд",-20,0,10]],
["🏹","Оружейники","Кузнецы предлагают закупить новое оружие для гвардии.",["Закупить",25,0,-25],["Отказаться",-5,0,0]],
["🏛️","Продажа титулов","Придворные готовы платить золотом за громкие титулы.",["Продать титулы",-5,-10,30],["Отказать",0,5,0]],
["💎","Опальный барон","Барон, обвинённый в измене, прячет сокровища.",["Конфисковать",5,-10,25],["Простить барона",0,10,0]],
// цепочки последствий (6-й элемент = ключ, в обычную колоду не попадают)
["🐉","Дракон вернулся","Откупленный дракон требует больше золота и жжёт деревни.",["Убить дракона",-25,25,-10],["Платить дань",0,-10,-25],"dragon"],
["🌾","Бунт голодных","Голодные толпы идут к замку.",["Раздать зерно",0,15,-20],["Разогнать толпу",-10,-25,0],"grain"],
["☠️","Чума в столице","Болезнь расползлась по городам.",["Закрыть город",-10,-10,-20],["Молиться и ждать",-10,-25,0],"plague"],
["👶","Наследник","Королева родила сына. Народ ликует!",["Устроить пир",0,25,-20],["Скромно отметить",0,10,0],"heir"],
["🗡️","Герцог поднял мятеж","Заговорщик больше не прячется!",["Подавить силой",-20,0,-10],["Откупиться",0,-10,-25],"duke"],
["⛪","Церковный раскол","Жрецы проклинают вас с амвона.",["Дать золото церкви",0,10,-25],["Изгнать жрецов",5,-25,10],"church"],
["⛏️","Обвал в шахте","Рудник рухнул, погибли рабочие.",["Выплатить семьям",0,15,-25],["Скрыть правду",0,-25,0],"gold"]
];
const KEYS = ["army", "people", "treasury"];
const NAMES = ["Могущество", "Преданность", "Казна"], ICONS = ["🛡️", "👥", "💰"];
const EASE = 1.3;            // множитель силы эффектов: больше = сложнее
let mercy = true;             // «Милость короны»: один спасительный шанс за правление
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 2400); }
function hint(o, a) { return "<small>" + a + " " + KEYS.map((k, n) => o[n + 1] ? ICONS[n] : "").join(" ") + "</small>"; }
const DEATHS = {
  army: ["⚔️", "Армия разбита, враги взяли столицу. Трон потерян."],
  people: ["🔥", "Разгневанный народ поднял бунт и сверг вас с престола."],
  treasury: ["💸", "Казна пуста, долги разрушили королевство."]
};
const DEATHS_HI = {
  army: ["🗡️", "Армия стала слишком могущественной. Генералы устроили переворот и посадили на трон своего."],
  people: ["🔥", "Народ боготворит вас, и знать, испугавшись такой любви, отравила вас на пиру."],
  treasury: ["🏴‍☠️", "Слухи о несметных богатствах привлекли соседей. Они напали и разграбили казну."]
};
const rankOf = y => y >= 50 ? "Легендарный государь" : y >= 30 ? "Великий монарх" : y >= 20 ? "Мудрый король" : y >= 10 ? "Достойный король" : y >= 5 ? "Новичок на троне" : "Короткое правление";
const plural = n => { const a = n % 100, b = n % 10; return (a > 10 && a < 15) ? "лет" : b === 1 ? "год" : (b > 1 && b < 5) ? "года" : "лет"; };

let stats, year, recent = [], cur, busy = false, queue = [];

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function toMenu() { const b = store.get("king_best", 0); $("best").textContent = b ? `Лучшее правление: ${b} ${plural(b)}` + (store.get("king_n", 1) > 1 ? ` · на троне король №${store.get("king_n", 1)}` : "") : ""; show("menu"); }
function draw() {
  // Если показатель просел (35 и ниже), колода помогает: не выпадают карточки, где оба ответа бьют по нему,
  // всегда есть ответ без вылета, а карточки с восстановлением выпадают чаще.
  const low = KEYS.map((k, n) => [k, n]).filter(([k]) => stats[k] <= 25);
  const gain = (e, n) => Math.max(e[3][n + 1], e[4][n + 1]);
  const safe = e => [e[3], e[4]].some(o => KEYS.every((k, n) => stats[k] + o[n + 1] > 5));
  const qi = queue.findIndex(q => q.at <= year);
  if (qi >= 0) { const q = queue.splice(qi, 1)[0], i = EVENTS.findIndex(e => e[5] === q.k); recent.push(i); if (recent.length > 6) recent.shift(); return i; }
  let pool = EVENTS.map((e, i) => i).filter(i => !recent.includes(i) && !EVENTS[i][5]);
  if (low.length) {
    const ok = pool.filter(i => safe(EVENTS[i]) && low.every(([k, n]) => gain(EVENTS[i], n) >= 0));
    if (ok.length) pool = ok;
  }
  const w = i => 1 + low.reduce((sum, [k, n]) => { const g = gain(EVENTS[i], n); return sum + (g >= 15 ? (stats[k] <= 20 ? 10 : 5) : g > 0 ? 1 : 0); }, 0);
  let r = Math.random() * pool.reduce((a, i) => a + w(i), 0), pick = pool[pool.length - 1];
  for (const i of pool) { r -= w(i); if (r <= 0) { pick = i; break; } }
  recent.push(pick); if (recent.length > 6) recent.shift();
  return pick;
}
function paint() {
  KEYS.forEach(k => { const f = $("f-" + k); f.style.width = stats[k] + "%"; f.classList.toggle("low", stats[k] <= 20 || stats[k] >= 80); });
  $("year").textContent = `Король №${store.get("king_n", 1)} · Год ${year}` + (mercy ? " · ✨" : "");
}
function render() {
  const e = EVENTS[cur];
  $("av").textContent = e[0]; $("et").textContent = (e[5] ? "⛓ " : "") + e[1]; $("ed").textContent = e[2];
  $("b1").innerHTML = e[3][0] + hint(e[3], "→"); $("b2").innerHTML = e[4][0] + hint(e[4], "←");
  const c = $("card"); c.style.transition = c.style.transform = c.style.opacity = ""; c.classList.remove("in"); void c.offsetWidth; c.classList.add("in");
}
function startGame() {
  stats = {army: 50, people: 50, treasury: 50}; year = 1; mercy = true; queue = []; busy = false; recent = [];
  cur = draw(); paint(); render(); show("game"); sfx("start");
}
function choose(i) {
  if (busy) return; busy = true;
  const o = EVENTS[cur][3 + i];
  if (o[4]) queue.push({k: o[4], at: year + 2 + Math.floor(Math.random() * 3)});
  KEYS.forEach((k, n) => {
    const d = Math.round(o[n + 1] * EASE); if (!d) return;
    stats[k] = Math.max(0, Math.min(100, stats[k] + d));
    const el = $("s-" + k), p = document.createElement("span");
    p.className = "pop " + (d > 0 ? "p" : "m"); p.textContent = (d > 0 ? "+" : "") + d;
    el.appendChild(p); setTimeout(() => p.remove(), 900);
    const cl = d > 0 ? "up" : "down"; el.classList.add(cl); setTimeout(() => el.classList.remove(cl), 600);
  });
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  sfx("tap"); year++; paint();
  setTimeout(() => {
    let dead = KEYS.find(k => stats[k] <= 0 || stats[k] >= 100);
    if (dead && mercy) { const n = KEYS.indexOf(dead); mercy = false; stats[dead] = stats[dead] >= 100 ? 70 : 30; dead = null; toast(`✨ Милость короны спасла: ${ICONS[n]} ${NAMES[n]}`); }
    if (dead) return gameOver(dead);
    if ((year - 1) % 8 === 0) {
      const n = KEYS.reduce((m, k, i) => stats[k] < stats[KEYS[m]] ? i : m, 0);
      stats[KEYS[n]] = Math.min(100, stats[KEYS[n]] + 5); toast(`🎉 ${year - 1} лет у власти! ${ICONS[n]} ${NAMES[n]} +5`);
    }
    paint();
    cur = draw(); render(); busy = false;
  }, 450);
}
function gameOver(k) {
  const years = year - 1, best = store.get("king_best", 0);
  const kn = store.get("king_n", 1), tot = store.get("king_total", 0) + years; store.set("king_n", kn + 1); store.set("king_total", tot);
  $("o-dyn").textContent = `Король №${kn} · всего за династию: ${tot} ${plural(tot)}`;
  const D = (stats[k] >= 100 ? DEATHS_HI : DEATHS)[k]; $("o-ic").textContent = D[0]; $("o-r").textContent = D[1];
  $("o-y").textContent = `${years} ${plural(years)}`; $("o-rank").textContent = rankOf(years);
  $("o-new").textContent = years > best ? "Новый рекорд!" : "";
  if (years > best) store.set("king_best", years);
  show("over"); sfx("lose");
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
}

/* ---------- музыка и звуки (WebAudio, без файлов) ---------- */
let ac, master, timer, step = 0, soundOn = store.get("king_sound", true), vol = store.get("king_vol", .5);
const SCALE = [293.66, 329.63, 349.23, 392, 440, 493.88, 523.25, 587.33]; // ре-дорийский лад
const MELODY = [0, null, 2, null, 4, 3, null, 2, 1, null, 3, null, 2, 0, null, null, 4, null, 5, 4, null, 3, 2, null, 1, null, 2, 0, null, null, null, null];
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = soundOn ? vol : 0; master.connect(ac.destination);
  [73.42, 110, 146.83, 220].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
    o.type = "sine"; o.frequency.value = f; g.gain.value = .045;
    l.frequency.value = .08 + i * .03; lg.gain.value = .02; l.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(master); o.start(); l.start();
  });
  timer = setInterval(() => {
    const n = MELODY[step++ % MELODY.length];
    if (n !== null) pluck(SCALE[n], .16);
    if (step % 8 === 1) pluck(SCALE[n === null ? 0 : n] / 2, .1);
  }, 430);
}
function pluck(f, v) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.7);
}
function sfx(type) {
  if (!ac || !soundOn) return;
  const seq = {tap: [[523, 0]], start: [[392, 0], [523, .12], [659, .24]], lose: [[392, 0], [330, .25], [262, .5], [196, .75]]}[type];
  seq.forEach(([f, d]) => setTimeout(() => pluck(f, .22), d * 1000));
}
function toggleSound() {
  soundOn = !soundOn; store.set("king_sound", soundOn); initAudio();
  master.gain.setTargetAtTime(soundOn ? vol : 0, ac.currentTime, .1); drawSnd();
}
$("vol").value = Math.round(vol * 100);
$("vol").addEventListener("input", e => {
  vol = e.target.value / 100; store.set("king_vol", vol); initAudio();
  if (vol > 0 && !soundOn) { soundOn = true; store.set("king_sound", true); drawSnd(); }
  master.gain.setTargetAtTime(soundOn ? vol : 0, ac.currentTime, .05);
});
function drawSnd() { $("snd-btn").textContent = "Звук: " + (soundOn ? "вкл" : "выкл"); }
document.addEventListener("pointerdown", () => { initAudio(); if (ac.state === "suspended") ac.resume(); }, {once: false});
document.addEventListener("visibilitychange", () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- свайп карточки (как в Reigns): вправо = верхний вариант, влево = нижний ---------- */
const card = $("card"); let drag = null, dx = 0;
function swPaint(d) {
  const sw = $("sw"), o = EVENTS[cur][d > 0 ? 3 : 4], on = Math.abs(d) > 20;
  sw.textContent = on ? o[0] : ""; sw.style.opacity = Math.min(1, Math.abs(d) / 90); sw.style.textAlign = d > 0 ? "right" : "left";
  KEYS.forEach((k, n) => $("s-" + k).classList.toggle("hl", on && !!o[n + 1]));
}
card.addEventListener("pointerdown", e => { if (busy || e.target.closest("button")) return; drag = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
card.addEventListener("pointermove", e => { if (drag === null) return; dx = e.clientX - drag; card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; swPaint(dx); });
function endDrag() {
  if (drag === null) return; drag = null; card.style.transition = "transform .25s,opacity .25s"; const d = dx; swPaint(0); dx = 0;
  if (Math.abs(d) > 90) { const s = d > 0 ? 1 : -1; card.style.transform = `translateX(${s * 480}px) rotate(${s * 25}deg)`; card.style.opacity = 0; choose(d > 0 ? 0 : 1); }
  else card.style.transform = "";
}
card.addEventListener("pointerup", endDrag); card.addEventListener("pointercancel", endDrag);

drawSnd(); toMenu();
</script>
